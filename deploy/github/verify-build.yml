name: Verify build

on:
  push:
    branches: [main]

concurrency:
  group: verify-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
