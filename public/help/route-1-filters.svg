  <rect x="40" y="560" width="310" height="44" rx="12" fill="#f97316"/>
  <text x="195" y="588" fill="#000" font-family="Rubik,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">щойшд</text>
  <text x="195" y="640" fill="#c4b5fd" font-family="Rubik,Arial,sans-serif" font-size="13" text-anchor="middle">шч бъйн щтебшйн аъ дсйреп рлрсйн мосмем</text>
</svg>
