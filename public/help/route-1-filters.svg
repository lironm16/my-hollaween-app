<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" role="img" aria-label="сйреп мфрй осмем">
  <rect width="390" height="780" fill="#12081a"/>
  <rect y="52" width="390" height="48" fill="#12081a" stroke="#f97316" stroke-opacity="0.15"/>
  <rect x="12" y="60" width="80" height="32" rx="8" fill="#261536"/>
  <rect x="300" y="60" width="78" height="32" rx="8" fill="#f97316"/>
  <text x="339" y="81" fill="#000" font-family="Rubik,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">сйреп</text>
  <rect x="24" y="130" width="342" height="520" rx="16" fill="#1d1028" stroke="#f97316" stroke-opacity="0.25"/>
  <text x="330" y="170" fill="#fdba74" font-family="Rubik,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="end">сйреп бъйн</text>
  <text x="330" y="220" fill="#fde68a" font-family="Rubik,Arial,sans-serif" font-size="15" text-anchor="end">шоъ фзг</text>
