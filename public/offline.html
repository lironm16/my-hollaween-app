<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HallowHood · לא מקוון</title>
    <link rel="stylesheet" href="/shell.css" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #12081a;
        color: #fff7ed;
        font-family: Rubik, sans-serif;
        padding: 24px 16px 40px;
      }
      h1 {
        font-size: 1.4rem;
        color: #fdba74;
        margin: 0 0 8px;
      }
      p {
        color: #ddd6fe;
        line-height: 1.45;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      a {
        display: inline-block;
        background: #f97316;
        color: #1c0e24;
        font-weight: 800;
        text-decoration: none;
        border-radius: 12px;
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <h1 id="offline-h1">אין חיבור</h1>
    <p id="offline-p">
      אין אינטרנט או שהשרת לא זמין. חזרו למפה כשיש קשר — רשימת הבתים לא נשמרת במכשיר.
    </p>
    <div class="actions">
      <a id="offline-a" href="/">נסו שוב את המפה</a>
    </div>
    <script>
      (function () {
        var en = false;
        try {
          en = localStorage.getItem("hw-app-locale") === "en";
        } catch (e) {}
        var root = document.documentElement;
        root.lang = en ? "en" : "he";
        root.dir = en ? "ltr" : "rtl";
        document.title = en ? "HallowHood · Offline" : "HallowHood · לא מקוון";
        if (en) {
          document.getElementById("offline-h1").textContent = "No connection";
          document.getElementById("offline-p").textContent =
            "You are offline or the server is unavailable. Return to the map when you are back online — the house list is not stored on this device.";
          document.getElementById("offline-a").textContent = "Try the map again";
        }
      })();
    </script>
  </body>
</html>
